# Publishes a GitHub release when a version tag (v*) is pushed: the car page
# as a zip (for self-hosting) and SHA-256 checksums. No APK: the app is built
# from source (README: Build from source).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Zip the car page
        run: |
          mkdir -p ../out
          (cd dist && zip -qr "../../out/carlink-car-page-${GITHUB_REF_NAME}.zip" .)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web
          path: out/

  release:
    needs: [web]
    runs-on: ubuntu-latest
    # Only this job can write: it runs no project code, just publishes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "carlink $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE-NOTES.md \
            --prerelease
