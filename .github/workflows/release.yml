# Builds everything from source and publishes a GitHub release when a
# version tag (v*) is pushed: the Android APK, the car page as a zip (for
# self-hosting) and SHA-256 checksums.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Rust + Android NDK
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - name: Core (Rust) tests and native libraries
        working-directory: core
        run: |
          cargo test --locked -q
          cargo ndk -t arm64-v8a -t x86_64 --platform 30 -o ../android/app/src/main/jniLibs build --release --locked
      - name: App tests and APK
        working-directory: android
        run: ./gradlew --no-daemon -q :app:testDebugUnitTest :app:assembleDebug
      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/carlink-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk
          path: out/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Zip the car page
        run: |
          mkdir -p ../out
          (cd dist && zip -qr "../../out/carlink-car-page-${GITHUB_REF_NAME}.zip" .)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web
          path: out/

  release:
    needs: [android, web]
    runs-on: ubuntu-latest
    # Only this job can write: it runs no project code, just publishes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "carlink $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE-NOTES.md \
            --prerelease
